name: CineDraft checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend-and-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm test
      - run: npm run test:ops
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: cinedraft_ci
          POSTGRES_PASSWORD: ci_only_ephemeral_password
          POSTGRES_DB: cinedraft_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cinedraft_ci -d cinedraft_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cinedraft_ci:ci_only_ephemeral_password@127.0.0.1:5432/cinedraft_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m scripts.prepare_demo --preview
        working-directory: backend
      - run: python -m scripts.portfolio_tour
        working-directory: backend
  source-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_release.py
      - run: python scripts/package_release.py build --out release-output/review.zip
      - run: python scripts/package_release.py verify release-output/review.zip
